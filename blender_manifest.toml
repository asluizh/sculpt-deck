schema_version = "1.0.0"

id = "sculpt_deck"
version = "0.1.0"
name = "Sculpt Deck"
tagline = "Sculpt with a pen and touch, without a keyboard"
maintainer = "Luiz Alves"
type = "add-on"

website = "https://github.com/asluizh/sculpt-deck"

# Optional list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/extensions/tags.html
tags = ["Sculpt", "3D View", "User Interface"]

blender_version_min = "5.2.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "preserve settings when enabling/disabling the add-on"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "docs/",
    ".gitignore",
    "/*.zip",
    "/bin",
    "settings.json",
    "preferences.json",
    "bundle.sh",
    "mypy.ini",
    "requirements.txt",
    "README.md",
    "PROJECT.md",
    "dev/",
]
